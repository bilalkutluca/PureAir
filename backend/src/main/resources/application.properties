spring.application.name=pureair-backend

# PostgreSQL/TimescaleDB ba?lant? ayarlari
spring.datasource.url=jdbc:postgresql://timescale:5432/${POSTGRES_DB:pureair}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA ve Hibernate ayarlari
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka ayarlari
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=pureair-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.backend.PureairBackend.dto
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.template.default-topic=raw-air-quality

# Jackson tarih format? ve saat dilimi ayarlari
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'
spring.jackson.time-zone=UTC

# Server portu
server.port=8080

# Actuator endpoint'leri
management.endpoints.web.exposure.include=health,info,metrics

# Log seviyeleri
logging.level.org.springframework.web=TRACE
logging.level.com.backend=TRACE



air.quality.recent.days=15